<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>TimePro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:16px;display:grid;gap:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1,h2{margin:0}header p{margin:4px 0;color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 3px 14px #0000000a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}label{font-size:13px;font-weight:700;color:#374151}input,textarea,button{font:inherit;border-radius:11px;padding:11px;border:1px solid #d1d5db}textarea{resize:vertical;min-height:70px}button{background:#111827;color:white;border:0;font-weight:700;cursor:pointer}.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:14px;border-radius:12px;background:#f9fafb}.total strong{font-size:24px}.error{color:#b91c1c;min-height:20px;font-size:13px}.ok{color:#047857;font-weight:700;min-height:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cards div{background:#f9fafb;padding:14px;border-radius:14px}.cards b{display:block;font-size:22px}.cards small{color:#6b7280}.entry{display:grid;grid-template-columns:1fr 1.2fr 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #eee;align-items:center}.entry:last-child{border-bottom:0}.entry span{color:#4b5563;font-size:14px}.empty{color:#6b7280}@media(max-width:650px){main{padding:10px}.grid,.cards{grid-template-columns:1fr}.entry{grid-template-columns:1fr 1fr}.entry span:nth-child(3){grid-column:1/-1}.entry b{grid-column:2}}
</style></head>
<body><main>
<header><div><h1>TimePro</h1><p>Feuille d’heures simple et rapide</p></div><strong>Employé</strong></header>
<section class="card"><h2>Nouvelle journée</h2><form id="form"><div class="grid">
<div class="field"><label>Employé</label><input name="employee" required placeholder="Nom et prénom"></div>
<div class="field"><label>Entreprise</label><input name="company" placeholder="Entreprise"></div>
<div class="field"><label>Date</label><input name="work_date" id="date" type="date" required></div>
<div class="field"><label>Lieu / chantier / client</label><input name="location" placeholder="Lieu ou client"></div>
<div class="field"><label>Début</label><input name="start_time" id="start" type="time" required></div>
<div class="field"><label>Fin</label><input name="end_time" id="end" type="time" required></div>
<div class="field"><label>Pause (minutes)</label><input name="pause_minutes" id="pause" type="number" min="0" value="30"></div>
<div class="field"><label>Recado</label><input name="note" placeholder="Optionnel"></div>
</div><div class="total"><span>Total calculado</span><strong id="total">0h 00min</strong></div><p id="error" class="error"></p><p id="ok" class="ok"></p><button type="submit">Enviar folha de horas</button></form></section>
<section class="card"><h2>Resumo</h2><div id="dashboard" class="cards"></div></section>
<section class="card"><h2>Histórico</h2><div id="history"><p class="empty">Carregando...</p></div></section>
</main>
<script>
const form=document.querySelector('#form'),start=document.querySelector('#start'),end=document.querySelector('#end'),pause=document.querySelector('#pause'),total=document.querySelector('#total'),error=document.querySelector('#error'),ok=document.querySelector('#ok'),history=document.querySelector('#history'),dashboard=document.querySelector('#dashboard'),date=document.querySelector('#date');
date.value=new Date().toISOString().slice(0,10);
const mins=v=>{if(!v)return null;const [h,m]=v.split(':').map(Number);return h*60+m};
const fmt=n=>`${Math.floor(n/60)}h ${String(n%60).padStart(2,'0')}min`;
function calc(){const a=mins(start.value),b=mins(end.value),p=Number(pause.value||0);if(a===null||b===null)return null;if(b<a||p<0)return -1;const t=b-a-p;return t>0?t:-1}
function update(){const t=calc();if(t===null){total.textContent='0h 00min';error.textContent='';return}if(t<0){total.textContent='—';error.textContent='L’heure de fin doit être après le début et la pause doit être valide.';return}total.textContent=fmt(t);error.textContent=''}
[start,end,pause].forEach(x=>x.addEventListener('input',update));
async function load(){try{const [h,d]=await Promise.all([fetch('/api/timepro/history'),fetch('/api/timepro/dashboard')]);const historyData=await h.json(),dash=await d.json();history.innerHTML=historyData.timesheets.length?historyData.timesheets.map(x=>`<article class="entry"><strong>${esc(x.work_date)}</strong><span>${esc(x.location||'')}</span><span>${esc(x.start_time)} → ${esc(x.end_time)}</span><b>${fmt(Number(x.total_minutes))}</b></article>`).join(''):'<p class="empty">Aucune feuille envoyée.</p>';dashboard.innerHTML=`<div><b>${dash.count}</b><small>Feuilles</small></div><div><b>${fmt(Number(dash.total_minutes))}</b><small>Heures</small></div><div><b>${dash.employees.length}</b><small>Employés</small></div>`}catch(e){error.textContent='Impossible de charger les données.'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';ok.textContent='';const t=calc();if(t===null||t<0){error.textContent='Vérifie les horaires.';return}const data=Object.fromEntries(new FormData(form).entries());data.pause_minutes=Number(data.pause_minutes||0);try{const r=await fetch('/api/timepro/timesheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok)throw new Error(body.error||'Erreur');ok.textContent='Feuille enregistrée avec succès.';form.reset();date.value=new Date().toISOString().slice(0,10);pause.value=30;total.textContent='0h 00min';await load()}catch(err){error.textContent=err.message}});
load();update();
</script></body></html>
