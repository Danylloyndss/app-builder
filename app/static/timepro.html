<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="TimePro - feuille d'heures digitale"><link rel="manifest" href="/timepro-manifest.json"><title>TimePro</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px}header{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 3px 14px #0000000a}.grid,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}label{font-size:13px;font-weight:700}input,textarea,button{font:inherit;border-radius:11px;padding:11px;border:1px solid #d1d5db}button{background:#111827;color:white;border:0;font-weight:700;cursor:pointer}button.alt{background:#e5e7eb;color:#111827}.total{display:flex;justify-content:space-between;padding:14px;border-radius:12px;background:#f9fafb;margin-top:12px}.total strong{font-size:24px}.msg{min-height:20px}.error{color:#b91c1c}.ok{color:#047857}.cards{grid-template-columns:repeat(4,1fr)}.cards div{background:#f9fafb;padding:14px;border-radius:14px}.cards b{display:block;font-size:22px}.cards small{color:#6b7280}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:150px}.entry{display:grid;grid-template-columns:85px 1fr 1.5fr 90px auto;gap:10px;padding:13px 0;border-bottom:1px solid #eee;align-items:center}.entry:last-child{border:0}.entry span{color:#4b5563;font-size:14px}.entry .meta{grid-column:1/-1;color:#6b7280;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button,.actions a{padding:8px 10px;font-size:12px;border-radius:9px;text-decoration:none}.actions a{background:#e5e7eb;color:#111827;font-weight:700}.signature{border:1px dashed #9ca3af;border-radius:12px;width:100%;height:150px;touch-action:none;background:white}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:15px}.modal .card{width:min(560px,100%)}@media(max-width:700px){main{padding:10px}.grid,.cards{grid-template-columns:1fr}.entry{grid-template-columns:1fr 1fr}.entry .actions,.entry .meta{grid-column:1/-1}.entry b{grid-column:2}}
</style></head><body><main><header><div><h1>TimePro</h1><div>Feuille d’heures simple et rapide</div></div><strong>👷 Employé</strong></header><section class="card"><h2 id="formTitle">Nouvelle journée</h2><form id="form"><div class="grid"><div class="field"><label>Employé</label><input name="employee" required placeholder="Nom et prénom"></div><div class="field"><label>Entreprise</label><input name="company" placeholder="Entreprise"></div><div class="field"><label>Date</label><input name="work_date" id="date" type="date" required></div><div class="field"><label>Lieu / chantier / client</label><input name="location" placeholder="Lieu ou client"></div><div class="field"><label>Début</label><input name="start_time" id="start" type="time" required></div><div class="field"><label>Fin</label><input name="end_time" id="end" type="time" required></div><div class="field"><label>Pause (minutes)</label><input name="pause_minutes" id="pause" type="number" min="0" value="30"></div><div class="field"><label>Recado</label><input name="note" placeholder="Optionnel"></div><div class="field"><label>Photos / justificatif</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple></div></div><div class="total"><span>Total</span><strong id="total">0h 00min</strong></div><p id="error" class="msg error"></p><p id="ok" class="msg ok"></p><div style="display:flex;gap:8px"><button id="save" type="submit">Enregistrer</button><button id="cancel" class="alt" type="button" hidden>Annuler</button></div></form></section><section class="card"><h2>Résumé</h2><div id="dashboard" class="cards"></div></section><section class="card"><h2>Historique</h2><div class="toolbar"><input id="employeeFilter" placeholder="Employé"><input id="companyFilter" placeholder="Entreprise"><input id="from" type="date" title="Du"><input id="to" type="date" title="Au"><button id="refresh">Actualiser</button><button id="export">📥 Exporter CSV</button><button id="exportPdf">📄 Exporter PDF</button><button id="print" class="alt">🖨️ Imprimer</button></div><div id="history">Chargement...</div></section></main><div id="sigModal" class="modal"><section class="card"><h2>Signature</h2><p>Signez avec le doigt ou la souris.</p><canvas id="sig" class="signature" width="1000" height="300"></canvas><div class="toolbar"><button id="clearSig" class="alt">Effacer</button><button id="saveSig">Enregistrer signature</button><button id="closeSig" class="alt">Fermer</button></div></section></div><script>
const form=document.querySelector('#form'),date=document.querySelector('#date'),start=document.querySelector('#start'),end=document.querySelector('#end'),pause=document.querySelector('#pause'),total=document.querySelector('#total'),error=document.querySelector('#error'),ok=document.querySelector('#ok'),history=document.querySelector('#history'),dashboard=document.querySelector('#dashboard'),employeeFilter=document.querySelector('#employeeFilter'),companyFilter=document.querySelector('#companyFilter'),from=document.querySelector('#from'),to=document.querySelector('#to'),files=document.querySelector('#files');let editing=null,sigId=null;date.value=new Date().toISOString().slice(0,10);const mins=v=>{if(!v)return null;const[a,b]=v.split(':').map(Number);return a*60+b},fmt=n=>`${Math.floor(n/60)}h ${String(n%60).padStart(2,'0')}min`,calc=()=>{const a=mins(start.value),b=mins(end.value),p=Number(pause.value||0);if(a===null||b===null)return null;const t=b-a-p;return t>0?t:-1};function update(){const t=calc();total.textContent=t===null?'0h 00min':t<0?'—':fmt(t);if(t<0)error.textContent='L’heure de fin doit être après le début et la pause doit être valide.';else if(error.textContent.includes('L’heure'))error.textContent=''}[start,end,pause].forEach(x=>x.addEventListener('input',update));function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function query(){const p=new URLSearchParams();if(employeeFilter.value.trim())p.set('employee',employeeFilter.value.trim());if(companyFilter.value.trim())p.set('company',companyFilter.value.trim());if(from.value)p.set('date_from',from.value);if(to.value)p.set('date_to',to.value);return p}async function load(){try{const qs=query().toString(),suffix=qs?'?'+qs:'';const [h,d]=await Promise.all([fetch('/api/timepro/history'+suffix),fetch('/api/timepro/dashboard'+suffix)]);const hd=await h.json(),dd=await d.json();localStorage.setItem('timepro-cache-history',JSON.stringify(hd));localStorage.setItem('timepro-cache-dashboard',JSON.stringify(dd));renderData(hd,dd)}catch(e){const hd=JSON.parse(localStorage.getItem('timepro-cache-history')||'null'),dd=JSON.parse(localStorage.getItem('timepro-cache-dashboard')||'null');if(hd&&dd){renderData(hd,dd);ok.textContent='Modo offline: mostrando os últimos dados sincronizados.'}else error.textContent='Impossible de charger les données.'}}function renderData(hd,dd){history.innerHTML=hd.timesheets.length?hd.timesheets.map(x=>{const at=(x.attachments||[]).map(a=>`<a href="/api/timepro/attachments?id=${a.id}" target="_blank" rel="noopener">📎 ${esc(a.filename)}</a>`).join(' ');return `<article class="entry"><strong>${esc(x.work_date)}</strong><span>${esc(x.employee)}</span><span>${esc(x.location||'')} · ${esc(x.start_time)} → ${esc(x.end_time)}</span><b>${fmt(+x.total_minutes)}</b><div class="actions"><button onclick="editRow(${x.id})">Modifier</button><button onclick="delRow(${x.id})">Suppr.</button><button onclick="openSig(${x.id})">${x.has_signature?'✍️ Signature':'Signature'}</button></div><div class="meta">🏢 ${esc(x.company||'—')} ${x.note?' · 📝 '+esc(x.note):''} ${at?' · '+at:''}</div></article>`}).join(''):'<p>Aucune feuille.</p>';dashboard.innerHTML=`<div><b>${dd.count}</b><small>Feuilles</small></div><div><b>${fmt(+dd.total_minutes)}</b><small>Total heures</small></div><div><b>${dd.employees.length}</b><small>Employés</small></div><div><b>${dd.companies.length}</b><small>Entreprises</small></div>`}window.editRow=async id=>{const r=(await (await fetch('/api/timepro/timesheet?id='+id)).json()).timesheet;if(!r)return;editing=id;for(const k of ['employee','company','work_date','location','start_time','end_time','pause_minutes','note'])form.elements[k].value=r[k]??'';document.querySelector('#formTitle').textContent='Modifier la journée';document.querySelector('#save').textContent='Mettre à jour';document.querySelector('#cancel').hidden=false;update();scrollTo(0,0)};window.delRow=async id=>{if(!confirm('Supprimer cette feuille ?'))return;const r=await fetch('/api/timepro/timesheets?id='+id,{method:'DELETE'});if(!r.ok){error.textContent='Suppression impossible.';return}await load()};form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';ok.textContent='';if(calc()<1){error.textContent='Vérifie les horaires.';return}const data=Object.fromEntries(new FormData(form).entries());data.pause_minutes=+data.pause_minutes||0;try{const url=editing?'/api/timepro/timesheets?id='+editing:'/api/timepro/timesheets',r=await fetch(url,{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),body=await r.json();if(!r.ok)throw Error(body.error||'Erreur');const id=body.timesheet.id;for(const f of files.files){const b=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(f)});const ar=await fetch('/api/timepro/attachments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timesheet_id:id,filename:f.name,mime_type:f.type,content_base64:b})});if(!ar.ok)throw Error('Une pièce jointe n’a pas pu être enregistrée.')}ok.textContent=editing?'Feuille mise à jour.':'Feuille enregistrée.';resetForm();await load()}catch(err){if(!navigator.onLine){const queue=JSON.parse(localStorage.getItem('timepro-queue')||'[]');const offlineFiles=[];for(const f of files.files){const b=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(f)});offlineFiles.push({filename:f.name,mime_type:f.type,content_base64:b})}queue.push({data,files:offlineFiles});localStorage.setItem('timepro-queue',JSON.stringify(queue));ok.textContent='Sem internet: folha guardada e será enviada quando voltar a conexão.';resetForm();return}error.textContent=err.message}});async function syncQueue(){if(!navigator.onLine)return;const queue=JSON.parse(localStorage.getItem('timepro-queue')||'[]');if(!queue.length)return;const pending=[];for(const item of queue){try{const r=await fetch('/api/timepro/timesheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item.data||item)});if(!r.ok){pending.push(item);continue}const body=await r.json().catch(()=>({}));const id=body.timesheet?.id;for(const f of (item.files||[])){const ar=await fetch('/api/timepro/attachments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timesheet_id:id,filename:f.filename,mime_type:f.mime_type,content_base64:f.content_base64})});if(!ar.ok)throw Error('attachment sync failed')}}catch(e){pending.push(item)}}localStorage.setItem('timepro-queue',JSON.stringify(pending));if(queue.length&&!pending.length){ok.textContent='Folhas offline sincronizadas.';await load()}}window.addEventListener('online',syncQueue);syncQueue();function resetForm(){form.reset();date.value=new Date().toISOString().slice(0,10);pause.value=30;total.textContent='0h 00min';editing=null;document.querySelector('#formTitle').textContent='Nouvelle journée';document.querySelector('#save').textContent='Enregistrer';document.querySelector('#cancel').hidden=true}document.querySelector('#cancel').onclick=resetForm;document.querySelector('#refresh').onclick=load;let filterTimer;[employeeFilter,companyFilter,from,to].forEach(x=>x.addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(load,250)}));document.querySelector('#export').onclick=()=>{const qs=query().toString();location.href='/api/timepro/export.csv'+(qs?'?'+qs:'')};document.querySelector('#exportPdf').onclick=()=>{const qs=query().toString();location.href='/api/timepro/export.pdf'+(qs?'?'+qs:'')};document.querySelector('#print').onclick=()=>window.print();
const modal=document.querySelector('#sigModal'),canvas=document.querySelector('#sig'),ctx=canvas.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let drawing=false;function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?.[0]||e;return[(p.clientX-r.left)*canvas.width/r.width,(p.clientY-r.top)*canvas.height/r.height]}function down(e){drawing=true;ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault()}function move(e){if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke();e.preventDefault()}function up(){drawing=false}canvas.addEventListener('mousedown',down);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',up);canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',up);window.openSig=id=>{sigId=id;ctx.clearRect(0,0,canvas.width,canvas.height);modal.style.display='grid'};document.querySelector('#clearSig').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);document.querySelector('#closeSig').onclick=()=>modal.style.display='none';document.querySelector('#saveSig').onclick=async()=>{if(!sigId)return;const b=canvas.toDataURL('image/png').split(',')[1];const r=await fetch('/api/timepro/signature',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timesheet_id:sigId,content_base64:b})});if(r.ok){modal.style.display='none';await load()}else{const x=await r.json().catch(()=>({}));error.textContent=x.error||'Signature impossible.'}};load();update();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/timepro-sw.js').catch(()=>{}));}
</script></body></html>
