<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Builder V1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0b1020;color:#f5f7ff}main{max-width:980px;margin:0 auto;padding:48px 20px}.card{background:#141b2f;border:1px solid #293451;border-radius:18px;padding:24px;box-shadow:0 15px 40px #0003}h1{margin:0 0 8px;font-size:32px}.muted{color:#aab4cc;margin-bottom:28px}textarea{width:100%;min-height:150px;resize:vertical;background:#0d1426;color:#fff;border:1px solid #34415f;border-radius:12px;padding:16px;font:inherit;outline:none}button{margin-top:14px;border:0;border-radius:10px;padding:13px 20px;background:#fff;color:#101522;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.status{margin-top:24px;padding:16px;border-radius:12px;background:#0d1426;color:#cbd5ee;white-space:pre-wrap}.result{margin-top:18px;display:none}.section{margin-top:18px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#24304a;color:#bcd0ff;font-size:12px}ul{padding-left:22px;color:#dce3f4}code{color:#c8d5ff}</style>
</head>
<body><main><div class="card">
<span class="pill">APP BUILDER V1</span><h1>O que você quer criar?</h1><div class="muted">Descreva o aplicativo em linguagem normal. O agente cria o plano e executa as tarefas.</div>
<textarea id="mission" placeholder="Ex.: Crie um aplicativo de folha de horas para funcionários, com cadastro, entrada, pausa, saída e painel da empresa."></textarea>
<button id="run">Começar construção</button>
<div id="status" class="status">Pronto para receber uma missão.</div>
<div id="result" class="result"><div class="section"><b>Plano</b><ul id="plan"></ul></div><div class="section"><b>Concluído</b><ul id="completed"></ul></div><div class="section"><b>Erros</b><ul id="errors"></ul></div></div>
</div></main>
<script>
const btn=document.querySelector('#run'), mission=document.querySelector('#mission'), status=document.querySelector('#status'), result=document.querySelector('#result');
function list(el,items){el.innerHTML=(items||[]).map(x=>`<li>${String(x).replaceAll('&','&amp;').replaceAll('<','&lt;')}</li>`).join('')||'<li>Nenhum</li>'}
btn.onclick=async()=>{const m=mission.value.trim();if(!m)return;btn.disabled=true;status.textContent='Agente trabalhando...';result.style.display='none';try{const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mission:m})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro');status.textContent='Construção concluída.';list(document.querySelector('#plan'),d.plan);list(document.querySelector('#completed'),d.completed);list(document.querySelector('#errors'),d.errors);result.style.display='block'}catch(e){status.textContent='Erro: '+e.message}finally{btn.disabled=false}};
</script></body></html>
